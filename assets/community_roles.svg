<svg width="900" height="120" viewBox="0 0 900 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg1" x1="0" y1="0" x2="280" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181c16"/>
      <stop offset="100%" stop-color="#0f140f"/>
    </linearGradient>
    <linearGradient id="cardBg2" x1="0" y1="0" x2="280" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141c19"/>
      <stop offset="100%" stop-color="#0c1411"/>
    </linearGradient>
    <linearGradient id="cardBg3" x1="0" y1="0" x2="280" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131a1e"/>
      <stop offset="100%" stop-color="#0c1216"/>
    </linearGradient>
  </defs>

  <!-- Card 1: CSI Club ASIET -->
  <g transform="translate(10, 0)">
    <rect width="280" height="120" rx="16" fill="url(#cardBg1)" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.2"/>
    
    <!-- Icon: Terminal Squircle -->
    <g transform="translate(16, 24)">
      <rect width="44" height="44" rx="12" fill="#29200c" stroke="#f59e0b" stroke-width="1.2"/>
      <path d="M 14 16 L 21 22 L 14 28" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="23" y1="28" x2="30" y2="28" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Info -->
    <text x="72" y="38" fill="#F8FAFC" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="0.3">CSI CLUB ASIET</text>
    <text x="72" y="55" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">Computer Society of India</text>
    
    <!-- Position Badge -->
    <g transform="translate(72, 68)">
      <rect width="160" height="24" rx="6" fill="#2b1f09" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="80" y="16" text-anchor="middle" fill="#facc15" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800">Tech Team Member</text>
    </g>
  </g>

  <!-- Card 2: µLearn ASIET -->
  <g transform="translate(310, 0)">
    <rect width="280" height="120" rx="16" fill="url(#cardBg2)" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.2"/>
    
    <!-- Icon: µLearn Squircle -->
    <g transform="translate(16, 24)">
      <rect width="44" height="44" rx="12" fill="#0c261b" stroke="#10B981" stroke-width="1.2"/>
      <text x="22" y="30" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-size="22" font-weight="900">µ</text>
    </g>

    <!-- Info -->
    <text x="72" y="38" fill="#F8FAFC" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="0.3">µLEARN ASIET</text>
    <text x="72" y="55" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">Open Learning Culture</text>
    
    <!-- Position Badge -->
    <g transform="translate(72, 68)">
      <rect width="160" height="24" rx="6" fill="#0d281d" stroke="#10B981" stroke-opacity="0.5"/>
      <text x="80" y="16" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800">Web Dev IG Core</text>
    </g>
  </g>

  <!-- Card 3: IEEE SB ASIET -->
  <g transform="translate(610, 0)">
    <rect width="280" height="120" rx="16" fill="url(#cardBg3)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
    
    <!-- Icon: IEEE Sine Diamond Squircle -->
    <g transform="translate(16, 24)">
      <rect width="44" height="44" rx="12" fill="#0a2130" stroke="#38bdf8" stroke-width="1.2"/>
      <polygon points="22,10 33,22 22,34 11,22" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 15 22 Q 18.5 17, 22 22 T 29 22" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Info -->
    <text x="72" y="38" fill="#F8FAFC" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" letter-spacing="0.3">IEEE SB ASIET</text>
    <text x="72" y="55" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500">Student Branch</text>
    
    <!-- Position Badge -->
    <g transform="translate(72, 68)">
      <rect width="160" height="24" rx="6" fill="#0a2333" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="80" y="16" text-anchor="middle" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800">Web Developer</text>
    </g>
  </g>
</svg>