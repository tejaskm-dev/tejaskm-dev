<svg width="900" height="110" viewBox="0 0 900 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <pattern id="ambientGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="10" height="10" rx="2.5" fill="#10B981" fill-opacity="0.06"/>
      <rect x="14" y="0" width="10" height="10" rx="2.5" fill="#10B981" fill-opacity="0.03"/>
      <rect x="0" y="14" width="10" height="10" rx="2.5" fill="#10B981" fill-opacity="0.04"/>
      <rect x="14" y="14" width="10" height="10" rx="2.5" fill="#34D399" fill-opacity="0.07"/>
    </pattern>
    
    <linearGradient id="tickerBg" x1="0" y1="0" x2="900" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111713"/>
      <stop offset="100%" stop-color="#090f0b"/>
    </linearGradient>
    <clipPath id="marqueeClip">
      <rect x="24" y="32" width="852" height="66" rx="4"/>
    </clipPath>
  </defs>

  <style>
    
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
    
    .marquee-stream {
      animation: verticalScrollMarquee 16s linear infinite;
    }
    .marquee-stream:hover {
      animation-play-state: paused;
    }
    @keyframes verticalScrollMarquee {
      0% { transform: translateY(0); }
      100% { transform: translateY(-208px); }
    }
    .live-dot {
      animation: liveDotPulse 1.2s infinite ease-in-out;
    }
    @keyframes liveDotPulse {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #34D399); }
      50% { opacity: 0.3; }
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="898" height="108" rx="12" fill="url(#tickerBg)" stroke="#1e2c24" stroke-width="1.2"/>

